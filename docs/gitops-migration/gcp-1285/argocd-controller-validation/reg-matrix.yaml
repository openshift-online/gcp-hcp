retainedAuthority:
- operator-owned wildcard cache get/list/watch including Secrets
- named bind/escalate for privileged installer and policy lifecycle
- writes to own ArgoCD CR and policy roles
- create for enumerated cluster resource kinds cannot be name constrained
- namespace writes for enumerated kinds
- indirect authority through managed admission policies, workloads and KCC IAM objects
additionalReviewNotes:
- Application destinations without namespaced manifests receive no RoleBinding.
- Application status/finalizer updates and core Event recording are controller control-loop additions.
- Cluster resources permit create by enumerated kind; update/patch/delete are limited to reviewed names.
  Namespace creation is required for application lifecycle.
- Gecko Channel/PlatformRole discovery was unavailable at baseline. Mapping is pinned Gecko private API
  source; runtime readiness must be recorded separately.
- GCP cloud mutations are delegated to KCC/ESO/GKE and other installed controllers. No direct GCP role
  is added.
