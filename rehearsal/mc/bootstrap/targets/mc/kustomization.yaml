apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- crds.yaml
- operator.yaml
- registry.yaml
- networkpolicy.yaml
- gitops-instance.yaml
- controller-policy.yaml
- controller-cluster-policy.yaml
- namespace-prerequisites.yaml
- scoped-rbac.yaml
patches:
- target:
    group: apiextensions.k8s.io
    version: v1
    kind: CustomResourceDefinition
    name: controllerconfigurations.promoter.argoproj.io
  patch: "apiVersion: apiextensions.k8s.io/v1\nkind: CustomResourceDefinition\nmetadata:\n\
    \  name: controllerconfigurations.promoter.argoproj.io\n  annotations:\n    client.lifecycle.config.k8s.io/deletion:\
    \ detach"
- target:
    group: argoproj.io
    version: v1beta1
    kind: ArgoCD
    name: gitops
    namespace: argocd
  patch: "apiVersion: argoproj.io/v1beta1\nkind: ArgoCD\nmetadata:\n  name: gitops\n\
    \  namespace: argocd\nspec:\n  defaultClusterScopedRoleDisabled: true"
- target:
    group: apps
    version: v1
    kind: Deployment
    name: openshift-gitops-operator-controller-manager
    namespace: gitops-operator
  patch: "apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: openshift-gitops-operator-controller-manager\n\
    \  namespace: gitops-operator\n  annotations:\n    config.kubernetes.io/depends-on:\
    \ apiextensions.k8s.io/CustomResourceDefinition/argocds.argoproj.io,apiextensions.k8s.io/CustomResourceDefinition/controllerconfigurations.promoter.argoproj.io,apiextensions.k8s.io/CustomResourceDefinition/namespacemanagements.argoproj.io,apiextensions.k8s.io/CustomResourceDefinition/notificationsconfigurations.argoproj.io,apiextensions.k8s.io/CustomResourceDefinition/rolloutmanagers.argoproj.io,external-secrets.io/namespaces/gitops-operator/ExternalSecret/redhat-registry-pull-secret"
- target:
    kind: CustomResourceDefinition
    name: argocds.argoproj.io
  patch: "apiVersion: apiextensions.k8s.io/v1\nkind: CustomResourceDefinition\nmetadata:\n\
    \  annotations:\n    client.lifecycle.config.k8s.io/deletion: detach\n  name:\
    \ argocds.argoproj.io\n"
- target:
    kind: CustomResourceDefinition
    name: controllerconfigurations.promoter.argoproj.io
  patch: "apiVersion: apiextensions.k8s.io/v1\nkind: CustomResourceDefinition\nmetadata:\n\
    \  annotations:\n    client.lifecycle.config.k8s.io/deletion: detach\n  name:\
    \ controllerconfigurations.promoter.argoproj.io\n"
- target:
    kind: CustomResourceDefinition
    name: namespacemanagements.argoproj.io
  patch: "apiVersion: apiextensions.k8s.io/v1\nkind: CustomResourceDefinition\nmetadata:\n\
    \  annotations:\n    client.lifecycle.config.k8s.io/deletion: detach\n  name:\
    \ namespacemanagements.argoproj.io\n"
- target:
    kind: CustomResourceDefinition
    name: notificationsconfigurations.argoproj.io
  patch: "apiVersion: apiextensions.k8s.io/v1\nkind: CustomResourceDefinition\nmetadata:\n\
    \  annotations:\n    client.lifecycle.config.k8s.io/deletion: detach\n  name:\
    \ notificationsconfigurations.argoproj.io\n"
- target:
    kind: CustomResourceDefinition
    name: rolloutmanagers.argoproj.io
  patch: "apiVersion: apiextensions.k8s.io/v1\nkind: CustomResourceDefinition\nmetadata:\n\
    \  annotations:\n    client.lifecycle.config.k8s.io/deletion: detach\n  name:\
    \ rolloutmanagers.argoproj.io\n"
- target:
    kind: Deployment
    name: openshift-gitops-operator-controller-manager
  patch: "apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: openshift-gitops-operator-controller-manager\n\
    \  namespace: gitops-operator\nspec:\n  replicas: 0\n"
