apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# Opt-in migration component, not referenced by the default bootstrap.
# Sync and verify this protection BEFORE releasing/removing these resources.
# Trial selectors: ArgoCD/argocd/gitops and ConfigMap/argocd/argocd-cm.
# Not production naming defaults: review both selectors and patch names.
# See repository-root docs/openshift-gitops-configuration-handoff.md,
# "Candidate assembly and checks", before adapting to another instance.
patches:
  - target:
      group: argoproj.io
      kind: ArgoCD
      name: gitops
      namespace: argocd
    patch: |-
      apiVersion: argoproj.io/v1beta1
      kind: ArgoCD
      metadata:
        name: gitops
        annotations:
          client.lifecycle.config.k8s.io/deletion: detach
  - target:
      kind: ConfigMap
      name: argocd-cm
      namespace: argocd
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-cm
        annotations:
          client.lifecycle.config.k8s.io/deletion: detach
