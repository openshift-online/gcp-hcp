# Embedded prefix-scoped comparison template, not a Kubernetes resource to apply.
# Preserve the researched role groups; no release mapping or publication yet.
schemaVersion: 1
kind: WIFConfigTemplate
metadata:
  name: gcp-known-iam
spec:
  iam:
    completeness: Complete
    # All entries are populated; source review and live runtime/IAM validation
    # are not complete. Complete is NOT permission to publish or execute.
    validation: Pending
    # All six source entries exist; runtime/configuration/naming validation remains open.
    pendingComponents: []
    # Data-owned eligibility: a catalog is publication-ready only when every
    # component below is present (serviceAccounts) and not pending.
    requiredComponents:
      - cloud-controller
      - cloud-network
      - ctrlplane-op
      - gcp-pd-csi
      - image-registry
      - nodepool-mgmt

    # Naming rules are protocol data, not CLI policy. Custom role IDs hex-encode
    # the infra ID bytes (GCP role IDs forbid '-'), so they are injective and are
    # never truncated; renderers fail when a limit would be exceeded.
    naming:
      maxInfraIDLength: 12
      maxCustomRoleIDLength: 64
      maxServiceAccountIDLength: 30
      maxWorkloadIdentityIDLength: 32
      customRoleIDTemplate: "hcp_{infraIDHex}_{role}"
      workloadIdentityPoolIDTemplate: "{infraID}-wi-pool"
      workloadIdentityProviderIDTemplate: "{infraID}-k8s-provider"

    # Templates are resolved for one installation, never shared across infra IDs.
    # These are the existing CLI identities and guest subjects, not new mappings.
    serviceAccounts:
      - name: cloud-controller
        accountIDTemplate: "{infraID}-cloud-controller"
        workloadIdentitySubjects:
          - system:serviceaccount:kube-system:cloud-controller-manager
      - name: cloud-network
        accountIDTemplate: "{infraID}-cloud-network"
        workloadIdentitySubjects:
          - system:serviceaccount:openshift-cloud-network-config-controller:cloud-network-config-controller
      - name: ctrlplane-op
        accountIDTemplate: "{infraID}-ctrlplane-op"
        workloadIdentitySubjects:
          - system:serviceaccount:kube-system:control-plane-operator
      - name: gcp-pd-csi
        accountIDTemplate: "{infraID}-gcp-pd-csi"
        workloadIdentitySubjects:
          - system:serviceaccount:openshift-cluster-csi-drivers:gcp-pd-csi-driver-controller-sa
      - name: image-registry
        accountIDTemplate: "{infraID}-image-registry"
        workloadIdentitySubjects:
          - system:serviceaccount:openshift-image-registry:cluster-image-registry-operator
          - system:serviceaccount:openshift-image-registry:registry
      - name: nodepool-mgmt
        accountIDTemplate: "{infraID}-nodepool-mgmt"
        workloadIdentitySubjects:
          - system:serviceaccount:kube-system:capi-gcp-controller-manager

    # Names below are logical references, NOT customer-project GCP role IDs.
    # Original five components match custom-roles-ctrlplane-dns.yaml unchanged.
    # CCM: 48 declared permissions + 3 source-traced operation reads; ccm-audit.md.
    # One role per (scope x nature) bucket: a binding grants its whole role at
    # one scope, so permissions that need different scopes must live in
    # separate roles. Hence the differing role counts per service account
    # (most components 2, ctrlplane-op 3, CCM 4); the comment on each role
    # below records why it is separate.
    # Prefix-scoped roles also show the CEL resource.name condition their
    # binding would carry, using GCP's documented resource-name formats with
    # [^/]+ standing in for the variable project/zone/region segments. These
    # conditions are provisional: no renderer exists and components do not
    # necessarily support prefix scoping yet (GCP-1446). Project-scope
    # bindings carry no condition.
    roles:
      - name: hcpCloudControllerResources
        # Load-balancer resource mutations (firewalls, forwarding rules,
        # regional backend services) on resources that carry the {infraID}-
        # prefix on new installs; bound prefix-scoped so they cannot reach
        # other clusters' resources in a shared project.
        # Provisional binding condition:
        # resource.name.matches('projects/[^/]+/global/firewalls/{infraID}-.*') ||
        # resource.name.matches('projects/[^/]+/regions/[^/]+/forwardingRules/{infraID}-.*') ||
        # resource.name.matches('projects/[^/]+/regions/[^/]+/backendServices/{infraID}-.*')
        permissions:
          - compute.firewalls.create
          - compute.firewalls.delete
          - compute.firewalls.get
          - compute.firewalls.update
          - compute.forwardingRules.create
          - compute.forwardingRules.delete
          - compute.forwardingRules.get
          - compute.regionBackendServices.create
          - compute.regionBackendServices.delete
          - compute.regionBackendServices.get
          - compute.regionBackendServices.update
          - compute.regionBackendServices.use
      - name: hcpCloudControllerInstances
        # Worker-VM access for load-balancer backends; get/use only. Separate
        # from the mutations above so instance lifecycle stays with
        # nodepool-mgmt: this component reads and uses instances but never
        # creates or deletes them.
        # Provisional binding condition:
        # resource.name.matches('projects/[^/]+/zones/[^/]+/instances/{infraID}-.*')
        permissions:
          - compute.instances.get
          - compute.instances.use
      - name: hcpCloudControllerReadOnly
        # List-style discovery reads and operation polling. List permissions
        # are checked at project level and cannot be restricted by resource-
        # name conditions, and operation names are GCP-generated without the
        # infra ID; read-only, so project scope is least privilege here.
        permissions:
          - compute.addresses.list
          - compute.globalOperations.get
          - compute.instanceGroups.list
          - compute.instances.list
          - compute.regionOperations.get
          - compute.zoneOperations.get
          - compute.zones.list
      - name: hcpCloudControllerSupport
        # Explicit project-wide exceptions, not read-only or per-cluster isolation.
        # Covers shared-network permissions (networks.updatePolicy,
        # subnetworks.use) and mutations on resources this component names
        # after Kubernetes services instead of the infra ID, which therefore
        # cannot be prefix-scoped like the roles above.
        permissions:
          - compute.addresses.create
          - compute.addresses.createInternal
          - compute.addresses.delete
          - compute.addresses.deleteInternal
          - compute.addresses.get
          - compute.addresses.use
          - compute.addresses.useInternal
          - compute.healthChecks.create
          - compute.healthChecks.delete
          - compute.healthChecks.get
          - compute.healthChecks.update
          - compute.healthChecks.useReadOnly
          - compute.httpHealthChecks.create
          - compute.httpHealthChecks.delete
          - compute.httpHealthChecks.get
          - compute.httpHealthChecks.update
          - compute.httpHealthChecks.useReadOnly
          - compute.instanceGroups.create
          - compute.instanceGroups.delete
          - compute.instanceGroups.get
          - compute.instanceGroups.update
          - compute.instanceGroups.use
          - compute.networks.updatePolicy
          - compute.subnetworks.use
          - compute.targetPools.addInstance
          - compute.targetPools.create
          - compute.targetPools.delete
          - compute.targetPools.get
          - compute.targetPools.removeInstance
          - compute.targetPools.use
      - name: hcpCloudNetworkInstances
        # The component's only mutating access: updating network interfaces
        # (alias IP configuration) on worker VMs. Bound prefix-scoped to this
        # cluster's instances, unlike the shared-subnet access below.
        # Provisional binding condition:
        # resource.name.matches('projects/[^/]+/zones/[^/]+/instances/{infraID}-.*')
        permissions:
          - compute.instances.get
          - compute.instances.updateNetworkInterface
      - name: hcpCloudNetworkSupport
        # Shared-subnet reads and zone operation polling; subnetworks and
        # operation names are not cluster-scoped, so these cannot be
        # prefix-conditioned and remain project-wide.
        permissions:
          - compute.subnetworks.get
          - compute.subnetworks.use
          - compute.zoneOperations.get
      - name: hcpControlPlaneDNS
        # Cloud DNS managed zones, record sets and Service Directory bindings
        # for the private zone: a distinct service surface from the compute
        # roles, bound at project scope. Kept separate so DNS and compute
        # grants can change without altering each other.
        permissions:
          - dns.changes.create
          - dns.managedZones.create
          - dns.managedZones.delete
          - dns.managedZones.get
          - dns.managedZones.list
          - dns.networks.bindPrivateDNSZone
          - dns.resourceRecordSets.create
          - dns.resourceRecordSets.delete
          - dns.resourceRecordSets.list
          - dns.resourceRecordSets.update
      - name: hcpControlPlaneResources
        # Firewall and forwarding-rule mutations, including Private Service
        # Connect rules, on {infraID}-prefixed resources; bound prefix-scoped
        # so control-plane ingress changes cannot reach other clusters'
        # resources.
        # Provisional binding condition:
        # resource.name.matches('projects/[^/]+/global/firewalls/{infraID}-.*') ||
        # resource.name.matches('projects/[^/]+/regions/[^/]+/forwardingRules/{infraID}-.*')
        permissions:
          - compute.firewalls.create
          - compute.firewalls.delete
          - compute.firewalls.get
          - compute.firewalls.update
          - compute.forwardingRules.create
          - compute.forwardingRules.delete
          - compute.forwardingRules.get
          - compute.forwardingRules.pscCreate
          - compute.forwardingRules.pscDelete
          - compute.forwardingRules.pscSetLabels
          - compute.forwardingRules.setLabels
      - name: hcpControlPlaneSupport
        # Internal addresses, shared-network use and Service Directory entries
        # backing control-plane ingress; these act on project-shared
        # infrastructure rather than {infraID}-prefixed resources, so the
        # binding is project-wide.
        permissions:
          - compute.addresses.createInternal
          - compute.addresses.deleteInternal
          - compute.addresses.get
          - compute.addresses.setLabels
          - compute.addresses.use
          - compute.globalOperations.get
          - compute.networks.get
          - compute.networks.updatePolicy
          - compute.networks.use
          - compute.regionOperations.get
          - compute.regions.get
          - compute.subnetworks.use
          - servicedirectory.namespaces.create
          - servicedirectory.services.create
          - servicedirectory.services.delete
      - name: hcpGCPPDCSIReadOnly
        # Discovery reads and operation polling; list permissions are checked
        # at project level and cannot be name-conditioned, so like the CCM
        # read-only role this is granted project-wide.
        permissions:
          - compute.diskTypes.list
          - compute.disks.list
          - compute.globalOperations.get
          - compute.images.list
          - compute.regionOperations.get
          - compute.snapshots.list
          - compute.zoneOperations.get
          - compute.zones.list
      - name: hcpGCPPDCSIResources
        # Volume lifecycle (disks, snapshots, snapshot-derived images) plus
        # the instance attach/detach/get needed to mount volumes. Every target
        # carries a reliable prefix (see roleBindings below), so one role and
        # one prefix-scoped binding suffice; contrast with CCM, which needs
        # two scoped roles for different resource surfaces.
        # Provisional binding condition:
        # resource.name.matches('projects/[^/]+/zones/[^/]+/instances/{infraID}-.*') ||
        # resource.name.matches('projects/[^/]+/zones/[^/]+/disks/{infraID}-pvc-.*') ||
        # resource.name.matches('projects/[^/]+/global/snapshots/{infraID}-snapshot-.*') ||
        # resource.name.matches('projects/[^/]+/global/images/{infraID}-snapshot-.*')
        permissions:
          - compute.disks.create
          - compute.disks.createSnapshot
          - compute.disks.delete
          - compute.disks.get
          - compute.disks.resize
          - compute.disks.setLabels
          - compute.disks.update
          - compute.disks.use
          - compute.disks.useReadOnly
          - compute.images.create
          - compute.images.delete
          - compute.images.get
          - compute.images.setLabels
          - compute.images.useReadOnly
          - compute.instances.attachDisk
          - compute.instances.detachDisk
          - compute.instances.get
          - compute.snapshots.create
          - compute.snapshots.delete
          - compute.snapshots.get
          - compute.snapshots.setLabels
          - compute.snapshots.useReadOnly
      - name: hcpImageRegistryDiscovery
        # storage.buckets.list only: project-level enumeration that cannot be
        # name-conditioned, kept separate so the mutating registry role stays
        # prefix-scoped.
        permissions:
          - storage.buckets.list
      - name: hcpImageRegistryResources
        # Registry bucket and object CRUD on the cluster's {infraID}- bucket;
        # bound prefix-scoped to the registry bucket and its objects.
        # Provisional binding condition ('.*' also covers /objects/ paths):
        # resource.name.matches('projects/_/buckets/{infraID}-.*')
        permissions:
          - storage.buckets.create
          - storage.buckets.delete
          - storage.buckets.get
          # Retained from the tested baseline; no source-version pruning here.
          - storage.buckets.update
          - storage.objects.create
          - storage.objects.delete
          - storage.objects.get
          - storage.objects.list
      - name: hcpNodePoolResources
        # Worker instance and boot-disk lifecycle: create, delete, labels,
        # metadata, service account and tags. Bound prefix-scoped to this
        # cluster's instances and disks.
        # Provisional binding condition:
        # resource.name.matches('projects/[^/]+/zones/[^/]+/instances/{infraID}-.*') ||
        # resource.name.matches('projects/[^/]+/zones/[^/]+/disks/{infraID}-.*')
        permissions:
          - compute.disks.create
          - compute.disks.setLabels
          - compute.instances.create
          - compute.instances.delete
          - compute.instances.get
          - compute.instances.setLabels
          - compute.instances.setMetadata
          - compute.instances.setServiceAccount
          # Compute network tags are not Resource Manager tag bindings.
          - compute.instances.setTags
      - name: hcpNodePoolSupport
        # Shared-subnet use for instance creation and zone operation polling;
        # subnetworks and operation names are not cluster-scoped, so these
        # remain project-wide.
        permissions:
          - compute.subnetworks.use
          - compute.zoneOperations.get

    # Original scopes encode historical bindings, not an isolation upgrade.
    # CCM scopes are source-backed proposals; the live probe did not test them.
    # Project bindings are unconditional, including support mutations.
    # ProjectResourceNamePrefixes scoping is provisional and tracked in
    # GCP-1446; no renderer or component support is committed yet.
    roleBindings:
      - serviceAccountRef: cloud-controller
        roleRef: hcpCloudControllerResources
        scope:
          # Requires new-install CCM naming; stock Service-UID/k8s names do not fit.
          kind: ProjectResourceNamePrefixes
          resources:
            - type: ComputeFirewall
              namePrefixTemplate: "{infraID}-"
            - type: ComputeForwardingRule
              namePrefixTemplate: "{infraID}-"
            - type: ComputeBackendService
              namePrefixTemplate: "{infraID}-"
      - serviceAccountRef: cloud-controller
        roleRef: hcpCloudControllerInstances
        scope:
          # Also depends on the established infra-ID-prefixed worker naming path.
          kind: ProjectResourceNamePrefixes
          resources:
            - type: ComputeInstance
              namePrefixTemplate: "{infraID}-"
      - serviceAccountRef: cloud-controller
        roleRef: hcpCloudControllerReadOnly
        scope:
          kind: Project
      - serviceAccountRef: cloud-controller
        roleRef: hcpCloudControllerSupport
        scope:
          kind: Project
      - serviceAccountRef: cloud-network
        roleRef: hcpCloudNetworkInstances
        scope:
          kind: ProjectResourceNamePrefixes
          resources:
            - type: ComputeInstance
              namePrefixTemplate: "{infraID}-"
      - serviceAccountRef: cloud-network
        roleRef: hcpCloudNetworkSupport
        scope:
          kind: Project
      - serviceAccountRef: ctrlplane-op
        roleRef: hcpControlPlaneDNS
        scope:
          kind: Project
      - serviceAccountRef: ctrlplane-op
        roleRef: hcpControlPlaneResources
        scope:
          kind: ProjectResourceNamePrefixes
          resources:
            - type: ComputeFirewall
              namePrefixTemplate: "{infraID}-"
            - type: ComputeForwardingRule
              namePrefixTemplate: "{infraID}-"
      - serviceAccountRef: ctrlplane-op
        roleRef: hcpControlPlaneSupport
        scope:
          kind: Project
      - serviceAccountRef: gcp-pd-csi
        roleRef: hcpGCPPDCSIReadOnly
        scope:
          kind: Project
      - serviceAccountRef: gcp-pd-csi
        roleRef: hcpGCPPDCSIResources
        scope:
          kind: ProjectResourceNamePrefixes
          resources:
            - type: ComputeInstance
              namePrefixTemplate: "{infraID}-"
            - type: ComputeDisk
              namePrefixTemplate: "{infraID}-pvc-"
            - type: ComputeSnapshot
              namePrefixTemplate: "{infraID}-snapshot-"
            - type: ComputeImage
              namePrefixTemplate: "{infraID}-snapshot-"
      - serviceAccountRef: image-registry
        roleRef: hcpImageRegistryDiscovery
        scope:
          kind: Project
      - serviceAccountRef: image-registry
        roleRef: hcpImageRegistryResources
        scope:
          kind: ProjectResourceNamePrefixes
          resources:
            - type: StorageBucketAndObjects
              namePrefixTemplate: "{infraID}-"
      - serviceAccountRef: nodepool-mgmt
        roleRef: hcpNodePoolResources
        scope:
          kind: ProjectResourceNamePrefixes
          resources:
            - type: ComputeInstance
              namePrefixTemplate: "{infraID}-"
            - type: ComputeDisk
              namePrefixTemplate: "{infraID}-"
      - serviceAccountRef: nodepool-mgmt
        roleRef: hcpNodePoolSupport
        scope:
          kind: Project

    # Existing guest federation; no management issuer or updater identity.
    workloadIdentityBindings:
      role: roles/iam.workloadIdentityUser
      serviceAccountRefs:
        - cloud-controller
        - cloud-network
        - ctrlplane-op
        - gcp-pd-csi
        - image-registry
        - nodepool-mgmt

    # iam.serviceAccounts.actAs is needed on the VM's attached SA, not the project.
    # WorkerServiceAccount is an installation input, not another component SA.
    serviceAccountRoleBindings:
      - role: roles/iam.serviceAccountUser
        scope:
          kind: ServiceAccount
          reference: WorkerServiceAccount
        memberServiceAccountRefs:
          - gcp-pd-csi
          - nodepool-mgmt
