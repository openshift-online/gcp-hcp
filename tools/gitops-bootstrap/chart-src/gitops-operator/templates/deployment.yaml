{{- /*
  Manager Deployment mirroring the official CSV (command, args, probes, ports,
  security context, metrics-certs volume) except `resources`, which is values-driven
  (an untuned initial budget; the official CSV sets none). Env comes from two maps so that the
  complete official image tuple is explicit; overlapping keys are rejected.
*/ -}}
{{- if eq (toString .Values.env.ENABLE_CONVERSION_WEBHOOK) "true" }}
{{- fail "ENABLE_CONVERSION_WEBHOOK=true is unsupported here: the ArgoCD CRD in this packaging is v1beta1-only and no conversion webhook certificates are provisioned" }}
{{- end }}
{{- range $name, $_ := .Values.imageEnv }}
{{- if hasKey $.Values.env $name }}
{{- fail (printf "env key %s is also an imageEnv key" $name) }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openshift-gitops-operator-controller-manager
  namespace: {{ .Release.Namespace }}
  labels:
    control-plane: gitops-operator
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      control-plane: gitops-operator
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: gitops-operator
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
      serviceAccountName: {{ include "gitops-operator.serviceAccountName" . }}
      terminationGracePeriodSeconds: 10
      containers:
        - name: manager
          image: {{ .Values.image.manager | quote }}
          command:
            - /usr/local/bin/manager
          args:
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8443
            - --leader-elect
            - --metrics-secure=true
          env:
            {{- range $name := keys .Values.env | sortAlpha }}
            - name: {{ $name }}
              value: {{ index $.Values.env $name | toString | quote }}
            {{- end }}
            {{- range $name := keys .Values.imageEnv | sortAlpha }}
            - name: {{ $name }}
              value: {{ index $.Values.imageEnv $name | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          ports:
            - containerPort: 9443
              name: webhook-server
              protocol: TCP
            - containerPort: 8443
              name: metrics
              protocol: TCP
            - containerPort: 8081
              name: health
              protocol: TCP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - mountPath: /tmp/k8s-metrics-server/serving-certs
              name: metrics-certs
              readOnly: true
      volumes:
        - name: metrics-certs
          secret:
            optional: true
            secretName: openshift-gitops-operator-metrics-tls
