# FIXTURE ONLY — NOT REVIEWED POLICY FOR ANY PERSISTENT ENVIRONMENT.
#
# Derived mechanically from the GCP-1285 disposable-pair overrides (see
# provenance below) plus the cert-manager startupapicheck delta found on
# 2026-11-18. It exists to exercise the assembly path and the offline tests in
# tools/gitops-bootstrap/tests/. Do not copy it to integration, stage or
# production, and do not infer missing grants for a different target. A real
# target needs its own reviewed inventory.
#
# Scoped-mode note: `gitops-hcp-controller-writes` in the clusterRules
# escalate/bind names is an aggregation role that does not exist under scoped
# mode, so that name is inert here. `gitops-hcp-controller-local` does exist
# and stays reachable by the controller's own escalate rule; that self-
# modification path is part of the reviewed residual authority, not a defect
# introduced by this fixture.
#
# `lifecycle: existing` marks namespaces the bundle never declares (default,
# kube-system): they are always present, so only their finite grants are
# emitted. Every other prerequisite namespace is declared by the bundle with
# deletion: detach and becomes the namespace's single declarative owner.
target: region
